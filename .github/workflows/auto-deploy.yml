name: Auto Commit and Deploy to AWS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy to AWS EC2
        env:
          DEPLOY_KEY: ${{ secrets.AWS_PRIVATE_KEY }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key.pem $AWS_USER@$AWS_HOST << 'EOF'
            cd /var/www/Sarab
            sudo git config --global --add safe.directory /var/www/Sarab
            sudo git fetch origin main
            sudo git reset --hard origin/main
            sudo chown -R www-data:www-data /var/www/Sarab
            sudo composer install --no-dev --optimize-autoloader
            sudo php artisan migrate --force
            sudo php artisan cache:clear
            sudo php artisan config:clear
            sudo php artisan view:clear
            sudo systemctl reload nginx
            echo "✅ Deployment successful!"
          EOF